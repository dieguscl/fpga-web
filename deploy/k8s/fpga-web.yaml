apiVersion: v1
kind: Namespace
metadata:
  name: fpga-web
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chipdb
  namespace: fpga-web
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpga-web
  namespace: fpga-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fpga-web}
  template:
    metadata:
      labels: {app: fpga-web}
    spec:
      # Own user namespace for the pod, so bubblewrap (nested userns) may mount a fresh /proc
      # for each sandboxed build; procMount Unmasked below requires it.
      hostUsers: false
      # This pod never calls the Kubernetes API, so it doesn't need its own
      # ServiceAccount token mounted; a free reduction in blast radius.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: Unconfined}
        appArmorProfile: {type: Localhost, localhostProfile: fpgaweb-bwrap}
      containers:
        - name: app
          image: fpga-web:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - {name: FPGAWEB_TRUST_PROXY, value: "true"}
            - {name: FPGAWEB_WORKERS, value: "2"}
          securityContext:
            procMount: Unmasked
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "3", memory: 8Gi}
          readinessProbe:
            httpGet: {path: /api/boards, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/boards, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 20
          volumeMounts:
            - {name: chipdb, mountPath: /var/lib/fpgaweb/chipdb}
            - {name: jobs, mountPath: /var/lib/fpgaweb/jobs}
      volumes:
        - name: chipdb
          persistentVolumeClaim: {claimName: chipdb}
        - name: jobs
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: fpga-web
  namespace: fpga-web
spec:
  selector: {app: fpga-web}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: fpga-web
spec:
  # Only Cloudflare edge IPs may reach this site (https://www.cloudflare.com/ips/, fetched 2026-09-25),
  # so CF-Connecting-IP (used for per-IP rate limits) cannot be spoofed by hitting the origin directly.
  ipAllowList:
    sourceRange:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fpga-web
  namespace: fpga-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: fpga-web-cloudflare-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: fpga.dieguscl.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fpga-web
                port: {number: 80}
