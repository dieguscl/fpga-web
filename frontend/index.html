<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070E1D" />
  <title>FPGA Web IDE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%2369F6B8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="banner" hidden></div>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" />
        <path class="brand-core" d="M11 11h10v10H11z" />
      </svg>
      <div class="brand-text">
        <span class="brand-name">FPGA<span class="brand-accent">WEB</span></span>
        <span class="label" data-i18n="brand.tagline">Build · Flash · Ship</span>
      </div>
    </div>

    <div class="group">
      <span class="label" data-i18n="label.project">Project</span>
      <div class="row">
        <select id="project" aria-label="Project" disabled></select>
        <button id="new-project" class="btn-ghost" disabled data-i18n="btn.new">New</button>
        <button id="import" class="btn-ghost" disabled data-i18n="btn.import">Import</button>
        <button id="export" class="btn-ghost" disabled data-i18n="btn.export">Export</button>
      </div>
    </div>

    <div class="group">
      <span class="label" data-i18n="label.target">Target</span>
      <div class="row">
        <select id="board" aria-label="Board" disabled></select>
        <label class="field"><span class="label" data-i18n="label.top">Top</span><input id="top" size="10" spellcheck="false" /></label>
      </div>
    </div>

    <div class="topbar-end">
      <button id="help" class="btn-ghost btn-icon" title="USB setup for flashing" data-i18n="btn.usbSetup" data-i18n-title="btn.usbSetup.title">USB setup</button>
      <button id="settings" class="btn-ghost btn-icon" title="Settings" data-i18n-title="settings.title" data-i18n-aria="settings.title" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <aside class="panel panel-files">
      <div class="panel-head"><span class="label" data-i18n="label.files">Files</span></div>
      <ul id="file-list"></ul>
      <button id="add-file" class="btn-ghost btn-block" disabled data-i18n="btn.newFile">+ New file</button>
      <button id="new-tb" class="btn-ghost btn-block" disabled data-i18n="btn.newTb">+ Testbench</button>
      <button id="new-circuit" class="btn-ghost btn-block" disabled data-i18n="btn.newCircuit">+ Circuit</button>
    </aside>
    <section class="panel panel-editor">
      <div class="editor-bar">
        <div class="view-toggle">
          <button id="tab-code" class="seg-btn active" data-i18n="tab.code">Code</button>
          <button id="tab-wave" class="seg-btn" hidden data-i18n="tab.wave">Waveform</button>
          <button id="tab-board" class="seg-btn" hidden data-i18n="tab.board">Board</button>
        </div>
        <div id="view-toggle" class="view-toggle" hidden>
          <button id="view-board" class="seg-btn active" data-i18n="view.board">Board</button>
          <button id="view-text" class="seg-btn" data-i18n="view.text">Text</button>
        </div>
      </div>
      <div id="editor"></div>
      <div id="planner" hidden></div>
      <div id="wave" hidden></div>
      <div id="circuit" hidden></div>
      <div id="vboard" hidden></div>
    </section>
    <section id="output" class="panel panel-output">
      <div class="panel-head"><span class="label" data-i18n="label.output">Output</span></div>
      <div class="actions">
        <button id="build" class="btn-primary" disabled data-i18n="btn.build">Build</button>
        <button id="simulate" class="btn-tertiary" disabled data-i18n="btn.simulate">Simulate</button>
        <select id="testbench" class="tb-select" aria-label="Testbench" hidden></select>
        <button id="flash" class="btn-tertiary" disabled data-i18n="btn.flash">Flash</button>
        <a id="download" class="btn-ghost" hidden data-i18n="btn.download">Download</a>
        <span class="actions-gap"></span>
        <label class="check"><input type="checkbox" id="lint" checked /><span data-i18n="chk.lint">Lint</span></label>
        <label class="check" title="Write to the board's flash memory so the design survives power-off" data-i18n-title="chk.persist.title"><input type="checkbox" id="to-flash" /><span data-i18n="chk.persist">Persist</span></label>
      </div>
      <div id="status">Ready</div>
      <div id="summary"></div>
      <pre id="log"></pre>
    </section>
  </main>

  <dialog id="settings-dialog">
    <h3 data-i18n="settings.title">Settings</h3>
    <div class="settings-form">
      <label class="field-col"><span class="label" data-i18n="settings.language">Language</span><select id="lang"></select></label>
      <div class="field-col"><span class="label" data-i18n="settings.theme">Appearance</span>
        <div class="seg-row" role="radiogroup">
          <button class="seg-btn" data-theme-choice="system" data-i18n="theme.system">System</button>
          <button class="seg-btn" data-theme-choice="dark" data-i18n="theme.dark">Dark</button>
          <button class="seg-btn" data-theme-choice="light" data-i18n="theme.light">Light</button>
        </div>
      </div>
    </div>
    <form method="dialog"><button class="btn-primary" data-i18n="btn.close">Close</button></form>
  </dialog>
  <dialog id="setup-help" class="hex-crop"><div id="setup-help-body"></div><form method="dialog"><button class="btn-primary" data-i18n="btn.close">Close</button></form></dialog>
  <input type="file" id="import-file" accept=".zip" hidden />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
